<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מילים באנגלית</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: a single centered notebook page on lined paper; each word is spelled with wooden letter tiles. */
:root {
  --paper: #f7f9ff;
  --line: #d6e4f7;
  --card: #ffffff;
  --fg: #1d2340;
  --muted: #5a6385;
  --ink: #2233a0;
  --margin: #ef9c9c;
  --tile: #ffd667;
  --tile-edge: #d9a12a;
  --tile-fg: #3a2a05;
  --slot: #e8eefb;
  --slot-edge: #b8c6e6;
  --good: #23955a;
  --good-soft: #dff5e8;
  --warn: #b86e00;
  --warn-soft: #fff1d6;
  --bad: #d4402f;
  --bad-soft: #fde5e1;
  --shadow: 0 2px 0 rgba(30, 40, 90, .08), 0 8px 24px rgba(30, 40, 90, .08);
  --font-display: "Fredoka", "Rubik", "Varela Round", system-ui, sans-serif;
  --font-body: "Rubik", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121833; --line: #1f2a52; --card: #1a2246; --fg: #e9edff; --muted: #a4acd3;
    --ink: #a9bcff; --margin: #7a3a4a; --tile: #f0c24e; --tile-edge: #a87b14; --tile-fg: #2b1f02;
    --slot: #232d58; --slot-edge: #3b4a85; --good: #4fcb86; --good-soft: #17392a;
    --warn: #ffb547; --warn-soft: #3d2c0f;
    --bad: #ff7262; --bad-soft: #42201e; --shadow: 0 2px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121833; --line: #1f2a52; --card: #1a2246; --fg: #e9edff; --muted: #a4acd3;
  --ink: #a9bcff; --margin: #7a3a4a; --tile: #f0c24e; --tile-edge: #a87b14; --tile-fg: #2b1f02;
  --slot: #232d58; --slot-edge: #3b4a85; --good: #4fcb86; --good-soft: #17392a;
  --warn: #ffb547; --warn-soft: #3d2c0f;
  --bad: #ff7262; --bad-soft: #42201e; --shadow: 0 2px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
}
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 18px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.en { font-family: var(--font-display); direction: ltr; unicode-bidi: isolate; }

/* Top bar */
.bar { display: flex; align-items: center; gap: 10px; }
.bar h1 {
  margin: 0; flex: 1; min-width: 0;
  font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; color: var(--ink);
  border-bottom: 2px solid var(--ink); padding-bottom: 2px; text-wrap: balance;
}
.icon-btn {
  border: 2px solid var(--slot-edge); background: var(--card); border-radius: 12px;
  min-width: 44px; height: 44px; padding: 0 12px; font-weight: 500; font-size: .95rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.icon-btn:hover { border-color: var(--ink); }

/* Progress */
.progress { display: flex; align-items: center; gap: 10px; font-size: .95rem; color: var(--muted); }
.track { flex: 1; height: 12px; border-radius: 99px; background: var(--slot); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .4s; }
.combo {
  font-weight: 700; color: var(--warn); background: var(--warn-soft);
  border-radius: 99px; padding: 2px 10px; font-size: .9rem; white-space: nowrap;
}

/* Picture card */
.card {
  background: var(--card); border-radius: 22px; box-shadow: var(--shadow);
  padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
}
.pic { font-size: clamp(4rem, 18vw, 6rem); line-height: 1.1; }
.he { font-size: 1.6rem; font-weight: 700; }
.big-word { font-size: clamp(2.4rem, 11vw, 3.6rem); font-weight: 600; color: var(--ink); line-height: 1.1; }
.say { color: var(--muted); font-size: 1.05rem; }
.say b { color: var(--fg); font-size: 1.2rem; }
.ex { color: var(--muted); font-size: 1rem; }
.ex .en { font-family: var(--font-body); font-size: 1.05rem; color: var(--fg); display: block; }
.speak {
  border: none; background: var(--slot); color: var(--ink); border-radius: 99px;
  padding: 8px 18px; font-weight: 500; display: inline-flex; gap: 8px; align-items: center;
}
.speak:hover { background: var(--slot-edge); }

/* Letter tiles */
.tiles {
  --n: 5;
  direction: ltr; display: flex; justify-content: center; gap: 6px; flex-wrap: nowrap;
  font-size: min(2.4rem, calc((100vw - 48px) / (var(--n) * 1.45)));
}
.t {
  width: 1.3em; height: 1.55em; flex: 0 0 auto; border-radius: .22em;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 600; text-transform: lowercase;
}
.t.letter { background: var(--tile); color: var(--tile-fg); box-shadow: inset 0 -.12em 0 var(--tile-edge); }
.t.blank { background: var(--slot); border: 2px dashed var(--slot-edge); color: transparent; }
.t.now { background: var(--card); border: 3px solid var(--ink); color: var(--ink); animation: pulse 1.2s ease-in-out infinite; }
.t.got { background: var(--good-soft); color: var(--good); box-shadow: inset 0 -.12em 0 var(--good); animation: pop .35s; }
.t.wrong { background: var(--bad-soft); color: var(--bad); box-shadow: inset 0 -.12em 0 var(--bad); }
.t.space { width: .6em; background: none; }

/* Answer choices */
.prompt { text-align: center; font-weight: 500; margin: 0; }
.choices { display: flex; justify-content: center; gap: 16px; direction: ltr; }
.choice {
  width: 84px; height: 92px; border-radius: 18px; border: none;
  background: var(--tile); color: var(--tile-fg); box-shadow: inset 0 -7px 0 var(--tile-edge), var(--shadow);
  font-family: var(--font-display); font-size: 2.8rem; font-weight: 600; transition: transform .1s;
}
.choice:hover:not(:disabled) { transform: translateY(-3px); }
.choice:active:not(:disabled) { transform: translateY(2px); }
.choice:disabled { opacity: .35; cursor: default; filter: grayscale(1); }

.feedback { min-height: 1.6em; text-align: center; font-weight: 700; font-size: 1.25rem; margin: 0; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }
.feedback.warm { color: var(--warn); }

/* Buttons */
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  border: none; border-radius: 14px; padding: 12px 22px; font-weight: 700; font-size: 1.1rem;
  background: var(--ink); color: var(--card); box-shadow: inset 0 -4px 0 rgba(0,0,0,.25);
}
.btn.soft { background: var(--slot); color: var(--ink); box-shadow: inset 0 -4px 0 var(--slot-edge); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.small { padding: 8px 14px; font-size: .95rem; }
.btn:disabled { opacity: .4; cursor: default; }

/* Dictation input */
.type-box, .name-box {
  width: 100%; max-width: 360px; direction: ltr; text-align: center;
  font-family: var(--font-display); font-size: 2rem; font-weight: 600;
  padding: 10px 14px; border-radius: 14px; border: 3px solid var(--slot-edge);
  background: var(--card); color: var(--ink);
}
.name-box { direction: rtl; font-family: var(--font-body); font-size: 1.2rem; max-width: 220px; padding: 8px 12px; }
.type-box:focus, .name-box:focus { border-color: var(--ink); outline: none; }
form.dict { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.reveal { font-size: 1.1rem; }

/* Home */
.hello { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hello h2 { margin: 0; font-size: 1.4rem; }
.hello form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hello label { font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat {
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 10px 12px;
  display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0;
}
.stat b { font-family: var(--font-display); font-size: 1.7rem; color: var(--ink); line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: .85rem; }
.tip {
  background: var(--warn-soft); border-radius: 16px; padding: 12px 16px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between;
}
.tip p { margin: 0; flex: 1; min-width: 12em; }
.levels { display: flex; flex-direction: column; gap: 10px; }
.level {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
  text-align: start; width: 100%; background: var(--card); border: 2px solid transparent;
  border-radius: 18px; padding: 12px 16px; box-shadow: var(--shadow);
}
.level:hover:not(:disabled) { border-color: var(--ink); }
.level:disabled { opacity: .55; cursor: default; box-shadow: none; }
.num {
  width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ink); color: var(--ink);
  display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 600; font-size: 1.2rem;
}
.level.done .num { background: var(--ink); color: var(--card); }
.lv-text { min-width: 0; display: flex; flex-direction: column; }
.lv-text b { font-size: 1.1rem; }
.lv-text small { color: var(--muted); font-size: .9rem; }
.stars { font-size: 1.2rem; letter-spacing: 1px; color: var(--tile-edge); white-space: nowrap; }
.stars .off { color: var(--slot-edge); }

.notebook {
  background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 18px;
  border-inline-end: 3px solid var(--margin);
}
.notebook h2 { margin: 0 0 6px; font-size: 1.05rem; color: var(--muted); font-weight: 500; }
.notebook ol { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 18px; }
.notebook li { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.notebook li .en { color: var(--ink); font-size: 1.15rem; font-weight: 500; }
.notebook li .he-s { color: var(--muted); }
@media (max-width: 420px) { .notebook ol { grid-template-columns: 1fr; } }

/* Progress screen */
.section-title { margin: 0; font-size: 1.2rem; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.badge {
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow); padding: 12px;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px;
}
.badge .b-ico { font-size: 2rem; }
.badge b { font-size: 1rem; }
.badge small { color: var(--muted); font-size: .8rem; line-height: 1.35; }
.badge.locked { box-shadow: none; background: var(--slot); }
.badge.locked .b-ico { filter: grayscale(1); opacity: .4; }
.words { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 6px 16px; }
.wrow { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.wrow:last-child { border-bottom: none; }
.wrow .w { min-width: 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.wrow .w .en { color: var(--ink); font-size: 1.15rem; font-weight: 600; }
.wrow .w small { color: var(--muted); }
.meter { display: flex; gap: 3px; direction: ltr; }
.meter i { width: 12px; height: 12px; border-radius: 3px; background: var(--slot); }
.meter i.on { background: var(--good); }
.pill { font-size: .8rem; font-weight: 700; border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.mid { background: var(--warn-soft); color: var(--warn); }
.pill.low { background: var(--bad-soft); color: var(--bad); }
.pill.new { background: var(--slot); color: var(--muted); }
.history { margin: 0; padding: 0; list-style: none; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); }
.history li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.history li:last-child { border-bottom: none; }
.history .d { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.history .s { font-variant-numeric: tabular-nums; font-weight: 500; }
.empty { color: var(--muted); margin: 0; }
.confirm { background: var(--bad-soft); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
.confirm p { margin: 0; }

/* Level complete */
.done-card .big-stars { font-size: 3.4rem; letter-spacing: 6px; color: var(--tile-edge); }
.done-card .big-stars .off { color: var(--slot-edge); }
.done-card h2 { margin: 0; font-size: 1.8rem; text-wrap: balance; }
.done-card p { margin: 0; }
.gain { font-family: var(--font-display); font-weight: 600; color: var(--warn); font-size: 1.3rem; }
.hard { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.hard span { background: var(--slot); border-radius: 99px; padding: 4px 12px; }
.new-badges { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.new-badges span { background: var(--warn-soft); color: var(--warn); border-radius: 99px; padding: 4px 12px; font-weight: 700; }

/* Learn dots */
.dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--slot-edge); }
.dots i.on { background: var(--ink); }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--paper); border-radius: 16px; padding: 12px 18px; box-shadow: var(--shadow);
  font-weight: 700; display: flex; gap: 10px; align-items: center; max-width: calc(100vw - 32px); z-index: 20;
  animation: rise .35s;
}

.shake { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes pulse { 50% { transform: translateY(-3px); } }
@keyframes rise { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="wrap" id="app" dir="rtl" lang="he"></div>
<div id="toast-root" dir="rtl" lang="he" aria-live="polite"></div>

<script>
// ---- Word lists. To add a new list, add another { name, words } object. ----
const WORD_LISTS = [{
  name: 'רשימה 1',
  words: [
    { en: 'age', say: "אֵייג'",       he: 'גיל',       pic: '👶🧒🧓', ex: 'My age is ten.',                     exHe: 'הגיל שלי הוא עשר.' },
    { en: 'also', say: "אוֹלְסוֹ",      he: 'גם',        pic: '🐱➕🐶', ex: 'Dana likes cats. She also likes dogs.', exHe: 'דנה אוהבת חתולים. היא גם אוהבת כלבים.' },
    { en: 'begin', say: "בִּיגִין",     he: 'להתחיל',    pic: '🏁',     ex: 'School begins at eight.',            exHe: 'בית הספר מתחיל בשמונה.' },
    { en: 'birthday', say: "בֶּרְתְ'דֵיי",  he: 'יום הולדת', pic: '🎂',     ex: 'Happy birthday!',                    exHe: 'יום הולדת שמח!' },
    { en: 'different', say: "דִיפְרֶנְט", he: 'שונה',      pic: '🍎🍌',   ex: 'A cat and a dog are different.',     exHe: 'חתול וכלב הם שונים.' },
    { en: 'hobby', say: "הוֹבִּי",     he: 'תחביב',     pic: '🎨',     ex: 'My hobby is drawing.',               exHe: 'התחביב שלי הוא ציור.' },
    { en: 'month', say: "מַאנְתְ'",     he: 'חודש',      pic: '📅',     ex: 'There are twelve months in a year.', exHe: 'יש שנים־עשר חודשים בשנה.' },
    { en: 'pool', say: "פּוּל",      he: 'בריכה',     pic: '🏊',     ex: 'We swim in the pool.',               exHe: 'אנחנו שוחים בבריכה.' },
    { en: 'the same', say: "דְ'ה סֵיים",  he: 'אותו דבר',  pic: '🧦🧦',   ex: 'We like the same food.',             exHe: 'אנחנו אוהבים את אותו האוכל.' },
    { en: 'year', say: "יִיר",      he: 'שנה',       pic: '🎆',     ex: 'A year has 365 days.',               exHe: 'בשנה יש 365 ימים.' }
  ]
}];

// Each level hides more letters, until the child writes the whole word alone.
const LEVELS = [
  { kind: 'learn', name: 'הכרות עם המילים', desc: 'רואים, שומעים וקוראים' },
  { kind: 'fill', hide: 1,     name: 'אות אחת חסרה',    desc: 'בוחרים את האות שחסרה' },
  { kind: 'fill', hide: 2,     name: 'שתי אותיות חסרות', desc: 'משלימים שתי אותיות' },
  { kind: 'fill', hide: 3,     name: 'שלוש אותיות חסרות', desc: 'משלימים שלוש אותיות' },
  { kind: 'fill', hide: 'most', name: 'רוב המילה חסרה',  desc: 'נשארות רק כמה אותיות' },
  { kind: 'dict', name: 'הכתבה', desc: 'כותבים את כל המילה לבד' }
];
const REVIEW = { kind: 'fill', hide: 2, name: 'חיזוק מילים קשות', review: true };

const BADGES = [
  { id: 'first',    ico: '👣', name: 'צעד ראשון',     how: 'מסיימים את שלב ההכרות' },
  { id: 'streak5',  ico: '🔥', name: 'על גל',          how: '5 תשובות נכונות ברצף' },
  { id: 'streak10', ico: '🚀', name: 'בלתי עצירים',    how: '10 תשובות נכונות ברצף' },
  { id: 'perfect',  ico: '💎', name: 'שלב מושלם',      how: '3 כוכבים בשלב תרגול' },
  { id: 'review',   ico: '💪', name: 'לא מוותרים',     how: 'מחזקים את המילים הקשות' },
  { id: 'days3',    ico: '📆', name: 'מתמידים',        how: 'משחקים ב־3 ימים שונים' },
  { id: 'dict',     ico: '✍️', name: 'כותבים לבד',     how: 'מסיימים את ההכתבה' },
  { id: 'master',   ico: '👑', name: 'אלופי המילים',   how: 'כל המילים ברשימה ברמה מלאה' }

// ---------- Progress: kept in the browser, and in the signed-in account when available ----------
const KEY = 'english-words-v2', OLD_KEY = 'english-words-progress';
function blankProgress() {
  return { name: '', stars: {}, xp: 0, words: {}, history: [], days: [], badges: {}, bestCombo: 0, updated: 0 };
}
function loadLocal() {
  try {
    const v = JSON.parse(localStorage.getItem(KEY));
    if (v) return Object.assign(blankProgress(), v);
  } catch (e) {}
  const p = blankProgress();
  try { const old = JSON.parse(localStorage.getItem(OLD_KEY)); if (old) p.stars = old; } catch (e) {}
  return p;
}
let P = loadLocal();
let cloud = null, cloudTimer = null, cloudBusy = false, cloudAgain = false;
function save() {
  P.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
  if (cloud) { clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 800); }
}
async function pushCloud() {
  if (!cloud) return;
  if (cloudBusy) { cloudAgain = true; return; }
  cloudBusy = true;
  try { await cloud.set(JSON.parse(JSON.stringify(P))); } catch (e) {}
  cloudBusy = false;
  if (cloudAgain) { cloudAgain = false; pushCloud(); }
}
async function connectCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.collection('data/users/' + id).doc('progress');
    const snap = await ref.get();
    const remote = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null;
    cloud = ref;
    if (remote && (remote.updated || 0) > (P.updated || 0)) {
      if (S.screen === 'home' || S.screen === 'progress') {
        P = Object.assign(blankProgress(), remote);
        try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {}
        S.screen === 'home' ? showHome() : showProgress();
      }
    } else if (!remote || (P.updated || 0) > (remote.updated || 0)) {
      pushCloud();
    }
  } catch (e) {}
}

function starsFor(l, lv) { return (P.stars[l] && P.stars[l][lv]) || 0; }
function isOpen(l, lv) { return lv === 0 || starsFor(l, lv - 1) > 0; }
function wstat(en) { return P.words[en] || (P.words[en] = { seen: 0, right: 0, wrong: 0, m: 0 }); }
function recordWord(en, firstTry, kind) {
  const w = wstat(en);
  w.seen++;
  if (firstTry) { w.right++; w.m = Math.min(MASTER, w.m + (kind === 'dict' ? 2 : 1)); }
  else { w.wrong++; w.m = Math.max(0, w.m - 1); }
}
function weakWords() {
  return list().words.map((w, i) => ({ i, s: P.words[w.en] }))
    .filter(x => x.s && x.s.wrong > 0 && x.s.m < 3)
    .sort((a, b) => a.s.m - b.s.m || b.s.wrong - a.s.wrong)
    .slice(0, 6).map(x => x.i);
}
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function markToday() {
  const t = today();
  if (!P.days.includes(t)) { P.days.push(t); P.days = P.days.slice(-90); }
}
function dayStreak() {
  const set = new Set(P.days);
  const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  let n = 0;
  for (;;) {
    const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    if (!set.has(k)) break;
    n++; d.setDate(d.getDate() - 1);
  }
  return n;
}
function award(id) {
  if (P.badges[id]) return;
  P.badges[id] = Date.now();
  S.newBadges.push(id);
  const b = BADGES.find(x => x.id === id);
  toast(`${b.ico} תג חדש: ${b.name}`);
}

// ---------- Session state ----------
let S = { screen: 'home', list: 0, level: 0, def: LEVELS[0], queue: [], qi: 0, firstTry: 0, word: null, busy: false,
          combo: 0, xpGain: 0, missed: [], newBadges: [], confirmReset: false, editName: false };

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function list() { return WORD_LISTS[S.list]; }
function cur() { return list().words[S.queue[S.qi]]; }
function starsHTML(n, cls) { return `<span class="${cls || 'stars'}" aria-label="${n} כוכבים">${'★'.repeat(n)}<span class="off">${'★'.repeat(3 - n)}</span></span>`; }
function praise() { return pick(PRAISE) + (P.name && Math.random() < 0.5 ? ', ' + esc(P.name) : '') + '!'; }
function addXP(n) { P.xp += n; S.xpGain += n; }

let player;
function speak(text) {
  const clip = AUDIO[text.toLowerCase()];
  if (clip) {
    try {
      if (canSpeak) speechSynthesis.cancel();
      if (player) player.pause();
      player = new Audio(clip);
      const p = player.play();
      if (p && p.catch) p.catch(() => speakTTS(text));
      return;
    } catch (e) {}
  }
  speakTTS(text);
}
function speakTTS(text) {
  if (!canSpeak) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.8;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
let actx;
function tone(freqs) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), s = t + i * 0.09;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.18, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.25);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s + 0.3);
    });
  } catch (e) {}
}
const sndGood = () => tone([660, 880]);
const sndBad = () => tone([220, 180]);
const sndWin = () => tone([523, 659, 784, 1046]);

let toastTimer;
function toast(text) {
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast">${text}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, 2600);
}

function topBar(withHome) {
  return `<div class="bar">
    <h1>מילים באנגלית</h1>
    ${withHome ? '<button class="icon-btn" data-act="home">תפריט</button>'
               : '<button class="icon-btn" data-act="progress">ההתקדמות שלי</button>'}
  </div>`;
}
function progressHTML() {
  const n = S.queue.length, done = S.qi;
  return `<div class="progress"><span>${S.def.name}</span>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${done}"><i style="width:${(done / n) * 100}%"></i></div>
    ${S.combo >= 3 ? `<span class="combo">🔥 ${S.combo}</span>` : ''}
    <span class="en">${Math.min(done + 1, n)}/${n}</span></div>`;
}
// How the word sounds, written in Hebrew letters (ת' = th, ד' = the soft th in "the").
function sayHTML(w) {
  return w.say ? `<div class="say">איך אומרים: <b>${w.say}</b></div>` : '';
}
function speakBtn(text) {
  if (!canSpeak && !AUDIO[text.toLowerCase()]) return '';
  return `<button class="speak" data-act="speak" data-say="${text}">🔊 <span>השמיעו את המילה</span></button>`;
}

// ---------- Home ----------
function suggestion() {
  const weak = weakWords();
  if (weak.length >= 2) return { text: `יש ${weak.length} מילים שכדאי לחזק: ${weak.map(i => list().words[i].en).join(', ')}`, act: 'review', label: 'לחזק עכשיו' };
  const next = LEVELS.findIndex((_, i) => isOpen(S.list, i) && !starsFor(S.list, i));
  if (next === 0) return { text: 'מתחילים? קודם מכירים את המילים, ואז מתרגלים.', act: 'start', lv: 0, label: 'להתחיל' };
  if (next > 0) return { text: `הצעד הבא שלכם: ${LEVELS[next].name}`, act: 'start', lv: next, label: 'להמשיך' };
  const low = LEVELS.findIndex((_, i) => i > 0 && starsFor(S.list, i) < 3);
  if (low > 0) return { text: `סיימתם את כל השלבים! אפשר לנסות לקבל 3 כוכבים ב"${LEVELS[low].name}".`, act: 'start', lv: low, label: 'לשפר' };
  return { text: 'כל השלבים עם 3 כוכבים. אתם אלופים! תנו להורים לבחור רשימת מילים חדשה.', act: null };
}
function helloHTML() {
  if (!P.name || S.editName) {
    return `<form class="hello" id="name-form" autocomplete="off">
      <label for="kid-name">איך קוראים לך?</label>
      <input id="kid-name" class="name-box" maxlength="20" value="${esc(P.name)}">
      <button class="btn small" type="submit">שמירה</button>
    </form>`;
  }
  const streak = dayStreak();
  return `<div class="hello"><h2>שלום, ${esc(P.name)}!</h2>
    <button class="icon-btn" data-act="edit-name" aria-label="שינוי השם">שינוי</button></div>
    ${streak >= 2 ? `<p class="empty">כבר ${streak} ימים ברצף שאתם מתאמנים. ככה מתקדמים!</p>` : ''}`;
}
function statsHTML() {
  const earned = Object.keys(P.badges).length;
  return `<div class="stats">
    <div class="stat"><b>${P.xp}</b><small>נקודות</small></div>
    <div class="stat"><b>${dayStreak()}</b><small>ימים ברצף</small></div>
    <div class="stat"><b>${earned}/${BADGES.length}</b><small>תגים</small></div>
  </div>`;
}
function showHome() {
  S.screen = 'home';
  const L = list(), tip = suggestion();
  const levels = LEVELS.map((lv, i) => {
    const st = starsFor(S.list, i), open = isOpen(S.list, i);
    return `<button class="level ${st ? 'done' : ''}" data-act="start" data-lv="${i}" ${open ? '' : 'disabled'}>
      <span class="num">${open ? i + 1 : '🔒'}</span>
      <span class="lv-text"><b>${lv.name}</b><small>${lv.desc}</small></span>
      ${starsHTML(st)}
    </button>`;
  }).join('');
  const words = L.words.map(w => `<li><span class="en">${w.en}</span><span class="he-s">${w.he}</span></li>`).join('');
  app.innerHTML = `${topBar(false)}
    ${helloHTML()}
    ${statsHTML()}
    <div class="tip"><p>${esc(tip.text)}</p>
      ${tip.act ? `<button class="btn small" data-act="${tip.act}" ${tip.lv != null ? `data-lv="${tip.lv}"` : ''}>${tip.label}</button>` : ''}</div>
    <div class="levels">${levels}</div>
    <section class="notebook"><h2>${L.name} · ${L.words.length} מילים</h2><ol>${words}</ol></section>`;
  const f = document.getElementById('name-form');
  if (f) f.addEventListener('submit', e => {
    e.preventDefault();
    P.name = document.getElementById('kid-name').value.trim().slice(0, 20);
    S.editName = false; save(); showHome();
  });
}

// ---------- Progress screen ----------
function masteryPill(s) {
  if (!s || !s.seen) return '<span class="pill new">עוד לא תרגלנו</span>';
  if (s.m >= 4) return '<span class="pill good">יודעים!</span>';
  if (s.m === 0 || s.wrong > s.right) return '<span class="pill low">צריך חיזוק</span>';
  return '<span class="pill mid">בדרך</span>';
}
function fmtDate(t) { const d = new Date(t); return d.getDate() + '.' + (d.getMonth() + 1); }
function showProgress() {
  S.screen = 'progress';
  const badges = BADGES.map(b => {
    const got = P.badges[b.id];
    return `<div class="badge ${got ? '' : 'locked'}"><span class="b-ico" aria-hidden="true">${b.ico}</span>
      <b>${b.name}</b><small>${got ? 'הושג ב־' + fmtDate(got) : b.how}</small></div>`;
  }).join('');
  const words = list().words.map(w => {
    const s = P.words[w.en], m = s ? s.m : 0;
    const meter = Array.from({ length: MASTER }, (_, i) => `<i class="${i < m ? 'on' : ''}"></i>`).join('');
    return `<div class="wrow"><span class="w"><span class="en">${w.en}</span><small>${w.he}</small></span>
      <span class="meter" aria-label="רמה ${m} מתוך ${MASTER}">${meter}</span>${masteryPill(s)}</div>`;
  }).join('');
  const hist = P.history.slice(-8).reverse().map(h => `<li><span class="d">${fmtDate(h.t)}</span><span>${esc(h.name)}</span>
      <span class="s">${h.score}/${h.total}</span>${h.stars ? starsHTML(h.stars) : '<span></span>'}</li>`).join('');
  const weak = weakWords();
  app.innerHTML = `${topBar(true)}
    <h2 class="section-title">${P.name ? 'ההתקדמות של ' + esc(P.name) : 'ההתקדמות שלי'}</h2>
    ${statsHTML()}
    ${weak.length ? `<div class="tip"><p>מילים שכדאי לחזק: ${weak.map(i => list().words[i].en).join(', ')}</p>
      <button class="btn small" data-act="review">לחזק עכשיו</button></div>` : ''}
    <h2 class="section-title">תגים</h2>
    <div class="badges">${badges}</div>
    <h2 class="section-title">רמת הידיעה של כל מילה</h2>
    <div class="words">${words}</div>
    <h2 class="section-title">משחקים אחרונים</h2>
    ${hist ? `<ul class="history">${hist}</ul>` : '<p class="empty">עוד לא שיחקתם. השלבים מחכים בתפריט!</p>'}
    ${S.confirmReset
      ? `<div class="confirm"><p>למחוק את כל הנקודות, הכוכבים והתגים? אי אפשר לבטל את זה.</p>
          <div class="row"><button class="btn danger small" data-act="reset-yes">כן, למחוק</button>
          <button class="btn soft small" data-act="reset-no">ביטול</button></div></div>`
      : '<div class="row"><button class="btn soft small" data-act="reset">איפוס ההתקדמות</button></div>'}`;
}

// ---------- Level flow ----------
function startLevel(lv) {
  S.level = lv; S.def = LEVELS[lv];
  const idx = list().words.map((_, i) => i);
  beginRound(S.def.kind === 'learn' ? idx : shuffle(idx));
}
function startReview() {
  const weak = weakWords();
  if (!weak.length) return showHome();
  S.level = -1; S.def = REVIEW;
  beginRound(shuffle(weak));
}
function beginRound(queue) {
  S.queue = queue; S.qi = 0; S.firstTry = 0; S.busy = false;
  S.combo = 0; S.xpGain = 0; S.missed = []; S.newBadges = [];
  markToday(); save();
  nextScreen();
}
function nextScreen() {
  if (S.qi >= S.queue.length) return showDone();
  S.screen = 'play';
  const k = S.def.kind;
  if (k === 'learn') showLearn();
  else if (k === 'fill') setupFill();
  else setupDict();
  window.scrollTo(0, 0);
}
function hitCombo() {
  S.combo++;
  if (S.combo > P.bestCombo) P.bestCombo = S.combo;
  if (S.combo >= 5) award('streak5');
  if (S.combo >= 10) award('streak10');
  return COMBO_MSG[S.combo] || '';
}

// ---------- Learn ----------
function showLearn() {
  const w = cur(), n = S.queue.length;
  wstat(w.en);
  const dots = S.queue.map((_, i) => `<i class="${i <= S.qi ? 'on' : ''}"></i>`).join('');
  app.innerHTML = `${topBar(true)}${progressHTML()}
    <div class="card">
      <div class="pic" aria-hidden="true">${w.pic}</div>
      <div class="big-word en">${w.en}</div>
      ${sayHTML(w)}
      <div class="he">${w.he}</div>
      ${speakBtn(w.en)}
      <div class="ex"><span class="en">${w.ex}</span>${w.exHe}</div>
    </div>
    <div class="dots" aria-hidden="true">${dots}</div>
    <div class="row">
      <button class="btn soft" data-act="learn-prev" ${S.qi === 0 ? 'disabled' : ''}>הקודמת</button>
      <button class="btn" data-act="learn-next">${S.qi === n - 1 ? 'סיימתי!' : 'המילה הבאה'}</button>
    </div>`;
}

// ---------- Fill in the missing letters ----------
function hideCount(rule, letters) {
  const n = rule === 'most' ? Math.ceil(letters * 0.7) : rule;
  return Math.max(1, Math.min(n, letters - 1));
}
function setupFill() {
  const w = cur(), chars = [...w.en.toLowerCase()];
  const pos = chars.map((c, i) => /[a-z]/.test(c) ? i : -1).filter(i => i >= 0);
  const hidden = shuffle(pos).slice(0, hideCount(S.def.hide, pos.length)).sort((a, b) => a - b);
  S.word = { chars, hidden, step: 0, mistake: false, options: null, tried: [] };
  S.busy = false;
  makeOptions();
  renderFill('', '');
}
function makeOptions() {
  const W = S.word, c = W.chars[W.hidden[W.step]];
  const out = [];
  const near = shuffle([...(CONFUSE[c] || '')]).filter(x => x !== c);
  if (near.length) out.push(near[0]);
  for (const x of shuffle([...'abcdefghiklmnoprstuwy'])) {
    if (out.length >= 2) break;
    if (x !== c && !out.includes(x)) out.push(x);
  }
  W.options = shuffle([c, ...out]);
  W.tried = [];
}
function tilesFill() {
  const W = S.word;
  return W.chars.map((c, i) => {
    if (c === ' ') return '<span class="t space"></span>';
    const h = W.hidden.indexOf(i);
    if (h === -1) return `<span class="t letter">${c}</span>`;
    if (h < W.step) return `<span class="t got">${c}</span>`;
    if (h === W.step) return `<span class="t now">?</span>`;
    return `<span class="t blank">_</span>`;
  }).join('');
}
function renderFill(msg, cls) {
  const w = cur(), W = S.word, finished = W.step >= W.hidden.length;
  const left = W.hidden.length - W.step;
  const choices = finished ? '' : W.options.map(o =>
    `<button class="choice" data-act="choose" data-l="${o}" ${W.tried.includes(o) ? 'disabled' : ''}>${o}</button>`).join('');
  app.innerHTML = `${topBar(true)}${progressHTML()}
    <div class="card">
      <div class="pic" aria-hidden="true">${w.pic}</div>
      <div class="he">${w.he}</div>
      ${speakBtn(w.en)}
    </div>
    <div class="tiles" style="--n:${W.chars.length}" aria-label="המילה">${tilesFill()}</div>
    <p class="prompt">${finished ? '' : (left > 1 ? `איזו אות חסרה? (נשארו ${left})` : 'איזו אות חסרה?')}</p>
    <div class="choices">${choices}</div>
    <p class="feedback ${cls}" aria-live="polite">${msg}</p>`;
}
function choose(btn) {
  if (S.busy) return;
  const W = S.word, letter = btn.dataset.l, right = W.chars[W.hidden[W.step]];
  if (letter === right) {
    sndGood();
    const firstPick = W.tried.length === 0;
    let combo = '';
    if (firstPick) { addXP(2); combo = hitCombo(); }
    W.step++;
    if (W.step >= W.hidden.length) {
      const w = cur();
      if (!W.mistake) { S.firstTry++; addXP(5); } else S.missed.push(S.queue[S.qi]);
      recordWord(w.en, !W.mistake, 'fill');
      save();
      S.busy = true;
      renderFill(combo ? `${praise()} 🔥 ${combo}` : (W.mistake ? 'הצלחתם! בפעם הבאה זה יהיה עוד יותר קל' : praise()), combo ? 'warm' : 'good');
      speak(w.en);
      setTimeout(() => { S.qi++; nextScreen(); }, 1400);
    } else {
      makeOptions();
      renderFill(combo ? `🔥 ${combo}` : 'נכון! עוד אחת', combo ? 'warm' : 'good');
    }
  } else {
    sndBad();
    W.mistake = true;
    S.combo = 0;
    W.tried.push(letter);
    let msg = pick(AFTER_MISS);
    if (W.tried.length >= 2) { msg = 'הקשיבו טוב למילה, זה יעזור 👂'; speak(cur().en); }
    renderFill(msg, 'bad');
    const b = app.querySelector(`.choice[data-l="${letter}"]`);
    if (b) b.classList.add('shake');
  }
}

// ---------- Dictation ----------
function setupDict() {
  S.word = { attempts: 0, hints: 0, solved: false, revealed: false };
  S.busy = false;
  renderDict('', '');
}
function tilesDict(typed, mark) {
  const target = cur().en.toLowerCase(), t = [...typed.toLowerCase()];
  return [...target].map((c, i) => {
    if (c === ' ') return '<span class="t space"></span>';
    const v = t[i] && t[i] !== ' ' ? t[i] : '';
    if (!v) return '<span class="t blank">_</span>';
    if (mark) return `<span class="t ${v === c ? 'got' : 'wrong'}">${esc(v)}</span>`;
    return `<span class="t letter">${esc(v)}</span>`;
  }).join('');
}
function renderDict(msg, cls, typed, mark) {
  const w = cur(), W = S.word;
  typed = typed || '';
  const done = W.solved || W.revealed;
  app.innerHTML = `${topBar(true)}${progressHTML()}
    <div class="card">
      <div class="pic" aria-hidden="true">${w.pic}</div>
      <div class="he">${w.he}</div>
      ${speakBtn(w.en)}
    </div>
    <div class="tiles" id="dict-tiles" style="--n:${w.en.length}">${tilesDict(done ? w.en : typed, mark || done)}</div>
    <form class="dict" id="dict-form" autocomplete="off">
      ${done ? '' : `<label for="dict-input" class="prompt">כתבו את המילה באנגלית</label>
      <input id="dict-input" class="type-box" maxlength="${w.en.length + 2}" value="${esc(typed)}" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin" lang="en">`}
      <p class="feedback ${cls}" aria-live="polite">${msg}</p>
      ${W.revealed ? `<p class="reveal">המילה היא <b class="en">${w.en}</b>. נחזק אותה בתרגול הבא!</p>` : ''}
      <div class="row">
        ${done ? '<button type="button" class="btn" data-act="dict-next">המילה הבאה</button>'
               : '<button type="submit" class="btn">בדיקה</button><button type="button" class="btn soft" data-act="hint">רמז</button>'}
      </div>
    </form>`;
  const inp = document.getElementById('dict-input');
  if (inp) {
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    inp.addEventListener('input', () => {
      document.getElementById('dict-tiles').innerHTML = tilesDict(inp.value, false);
    });
  }
  document.getElementById('dict-form').addEventListener('submit', e => { e.preventDefault(); checkDict(); });
}
function norm(s) { return s.toLowerCase().replace(/\s+/g, ' ').trim(); }
function checkDict() {
  if (S.busy) return;
  const w = cur(), W = S.word, inp = document.getElementById('dict-input');
  const typed = inp ? inp.value : '';
  if (!norm(typed)) return renderDict('צריך לכתוב משהו קודם', 'bad', typed);
  if (norm(typed) === norm(w.en)) {
    W.solved = true;
    const first = W.attempts === 0 && W.hints === 0;
    let combo = '';
    if (first) { S.firstTry++; addXP(15); combo = hitCombo(); }
    else { addXP(5); S.missed.push(S.queue[S.qi]); }
    recordWord(w.en, first, 'dict');
    save();
    sndGood(); speak(w.en);
    const msg = first ? praise() + (combo ? ' 🔥 ' + combo : ' כתבתם לבד!') : 'הצלחתם! התמדה משתלמת';
    renderDict(msg, combo ? 'warm' : 'good', typed);
    return;
  }
  W.attempts++;
  S.combo = 0;
  sndBad();
  if (W.attempts >= 3) {
    W.revealed = true;
    S.missed.push(S.queue[S.qi]);
    recordWord(w.en, false, 'dict');
    save();
    speak(w.en);
    renderDict('', '', typed);
  } else {
    const t = norm(typed), target = norm(w.en);
    let ok = 0;
    for (let i = 0; i < target.length; i++) if (t[i] === target[i]) ok++;
    const msg = ok >= target.length - 1 ? 'כמעט! רק אות אחת לא נכונה' : 'האותיות האדומות לא נכונות. נסו שוב';
    renderDict(msg, 'bad', typed, true);
    const tl = document.getElementById('dict-tiles');
    if (tl) tl.classList.add('shake');
  }
}
function hint() {
  const w = cur(), inp = document.getElementById('dict-input');
  const typed = (inp ? inp.value : '').toLowerCase(), target = w.en.toLowerCase();
  let i = 0;
  while (i < typed.length && typed[i] === target[i]) i++;
  if (i >= target.length) return;
  S.word.hints++;
  let next = target.slice(0, i + 1);
  if (target[i] === ' ') next = target.slice(0, i + 2);
  renderDict('הנה אות אחת בחינם', '', next);
}

// ---------- Level complete: stars, points and personal feedback ----------
function showDone() {
  S.screen = 'done';
  const def = S.def, n = S.queue.length, learn = def.kind === 'learn';
  const ratio = learn ? 1 : S.firstTry / n;
  const stars = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : 1;
  const prev = P.history.filter(h => h.list === S.list && h.lv === S.level && !learn);
  const prevBest = prev.length ? Math.max(...prev.map(h => h.score)) : null;

  addXP(learn ? 10 : 20);
  if (stars === 3 && !learn) addXP(10);
  if (S.level >= 0) {
    P.stars[S.list] = P.stars[S.list] || {};
    P.stars[S.list][S.level] = Math.max(stars, starsFor(S.list, S.level));
  }
  if (learn) award('first');
  if (!learn && stars === 3 && !def.review) award('perfect');
  if (def.kind === 'dict') award('dict');
  if (def.review) award('review');
  if (P.days.length >= 3) award('days3');
  if (list().words.every(w => P.words[w.en] && P.words[w.en].m >= MASTER)) award('master');
  P.history.push({ t: Date.now(), list: S.list, lv: S.level, name: def.name, score: learn ? n : S.firstTry, total: n, stars: S.level >= 0 ? stars : 0 });
  P.history = P.history.slice(-40);
  save();
  sndWin();

  let headline, lines = [];
  if (learn) { headline = 'הכרתם את כל המילים!'; lines.push('עכשיו מתחילים לתרגל. כל שלב מסתיר עוד קצת.'); }
  else if (ratio === 1) { headline = 'מושלם!'; lines.push(`כל ${n} המילים נכונות כבר בניסיון הראשון.`); }
  else if (stars === 3) { headline = 'כמעט מושלם!'; lines.push(`${S.firstTry} מתוך ${n} מילים נכונות בניסיון הראשון. הרווחתם שלושה כוכבים!`); }
  else if (ratio >= 0.7) { headline = 'עבודה טובה מאוד!'; lines.push(`${S.firstTry} מתוך ${n} מילים נכונות בניסיון הראשון. עוד קצת ותגיעו לשלושה כוכבים.`); }
  else { headline = 'התחלה טובה!'; lines.push(`${S.firstTry} מתוך ${n} בניסיון הראשון. כל תרגול מחזק את הזיכרון, ובפעם הבאה יהיה קל יותר.`); }
  if (prevBest != null && S.firstTry > prevBest) lines.push(`שיפור! בפעם הקודמת הכי טוב היה ${prevBest}, והיום ${S.firstTry}.`);
  if (P.name) headline = headline.replace(/!$/, ', ' + esc(P.name) + '!');

  const missed = [...new Set(S.missed)].map(i => list().words[i]);
  const hasNext = S.level >= 0 && S.level < LEVELS.length - 1;
  const goNext = hasNext && stars >= 2;
  const nb = S.newBadges.map(id => BADGES.find(b => b.id === id)).map(b => `<span>${b.ico} ${b.name}</span>`).join('');
  app.innerHTML = `${topBar(true)}
    <div class="card done-card">
      <h2>${headline}</h2>
      ${S.level >= 0 ? starsHTML(stars, 'big-stars') : '<div class="pic" aria-hidden="true">💪</div>'}
      ${lines.map(l => `<p>${l}</p>`).join('')}
      <p class="gain">+${S.xpGain} נקודות</p>
      ${nb ? `<p>תגים חדשים:</p><div class="new-badges">${nb}</div>` : ''}
      ${missed.length ? `<p>מילים לחיזוק:</p><div class="hard">${missed.map(w => `<span><span class="en">${w.en}</span> ${w.he}</span>`).join('')}</div>` : ''}
    </div>
    <div class="row">
      ${goNext ? `<button class="btn" data-act="start" data-lv="${S.level + 1}">לשלב הבא: ${LEVELS[S.level + 1].name}</button>` : ''}
      ${!goNext && S.level >= 0 ? `<button class="btn" data-act="start" data-lv="${S.level}">לשחק שוב ולשפר</button>` : ''}
      ${missed.length && !def.review ? '<button class="btn soft" data-act="review">לחזק את המילים הקשות</button>' : ''}
      ${goNext ? `<button class="btn soft" data-act="start" data-lv="${S.level}">לשחק שוב</button>` : ''}
      <button class="btn soft" data-act="home">לתפריט</button>
    </div>
    ${hasNext && !goNext ? '<p class="empty" style="text-align:center">השלב הבא כבר פתוח, אבל כדאי לנסות להגיע לשני כוכבים קודם.</p>' : ''}`;
  window.scrollTo(0, 0);
}

// ---------- Events ----------
function stopSound() { if (canSpeak) speechSynthesis.cancel(); if (player) player.pause(); }
const ACT = {
  home: () => { stopSound(); showHome(); window.scrollTo(0, 0); },
  progress: () => { S.confirmReset = false; showProgress(); window.scrollTo(0, 0); },
  start: b => startLevel(+b.dataset.lv),
  review: () => startReview(),
  speak: b => speak(b.dataset.say),
  'learn-prev': () => { if (S.qi > 0) { S.qi--; showLearn(); } },
  'learn-next': () => { S.qi++; nextScreen(); },
  choose: b => choose(b),
  hint: () => hint(),
  'dict-next': () => { S.qi++; nextScreen(); },
  'edit-name': () => { S.editName = true; showHome(); const i = document.getElementById('kid-name'); if (i) i.focus(); },
  reset: () => { S.confirmReset = true; showProgress(); },
  'reset-no': () => { S.confirmReset = false; showProgress(); },
  'reset-yes': () => { const name = P.name; P = blankProgress(); P.name = name; S.confirmReset = false; save(); showProgress(); toast('ההתקדמות אופסה'); }
};
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  ACT[b.dataset.act](b);
});
// Letter keys pick an answer on the fill-in screens.
document.addEventListener('keydown', e => {
  if (S.screen !== 'play' || S.def.kind !== 'fill' || !S.word || !S.word.options || e.target.tagName === 'INPUT') return;
  const b = app.querySelector(`.choice[data-l="${e.key.toLowerCase()}"]:not(:disabled)`);
  if (b) b.click();
});

showHome();
connectCloud();
</script>
